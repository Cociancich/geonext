  <!-- Riferimento al file locale scaricato -->
    <script src="leaflet.js"></script>

    <script>
        // Algoritmo ray-casting per verificare se un punto e dentro un anello [lng, lat]
        function isPointInRing(point, ring) {
            const x = point[0];
            const y = point[1];
            let inside = false;

            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i][0];
                const yi = ring[i][1];
                const xj = ring[j][0];
                const yj = ring[j][1];

                const intersect = ((yi > y) !== (yj > y)) &&
                    (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi);

                if (intersect) inside = !inside;
            }

            return inside;
        }

        // Supporto GeoJSON Polygon e MultiPolygon
        function isPointInGeometry(point, geometry) {
            if (!geometry) return false;

            if (geometry.type === 'Polygon') {
                const rings = geometry.coordinates;
                if (!rings.length) return false;

                if (!isPointInRing(point, rings[0])) return false;
                for (let i = 1; i < rings.length; i++) {
                    if (isPointInRing(point, rings[i])) return false;
                }
                return true;
            }

            if (geometry.type === 'MultiPolygon') {
                for (const polygon of geometry.coordinates) {
                    if (!polygon.length) continue;

                    if (!isPointInRing(point, polygon[0])) continue;

                    let inHole = false;
                    for (let i = 1; i < polygon.length; i++) {
                        if (isPointInRing(point, polygon[i])) {
                            inHole = true;
                            break;
                        }
                    }

                    if (!inHole) return true;
                }
            }

            return false;
        }

        function getCountryName(feature) {
            const props = feature && feature.properties ? feature.properties : {};
            return props.ADMIN || props.NAME || props.name || 'Stato sconosciuto';
        }

        function normalizeCountryName(name) {
            if (!name) return '';
            return String(name)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
        }

        function decodeCsvBytes(arrayBuffer) {
            const utf8Text = new TextDecoder('utf-8').decode(arrayBuffer);
            if (utf8Text.indexOf('\uFFFD') === -1) {
                return utf8Text;
            }

            const win1252Text = new TextDecoder('windows-1252').decode(arrayBuffer);
            const utf8ReplacementCount = (utf8Text.match(/\uFFFD/g) || []).length;
            const win1252ReplacementCount = (win1252Text.match(/\uFFFD/g) || []).length;

            return win1252ReplacementCount < utf8ReplacementCount ? win1252Text : utf8Text;
        }

        function parseSemicolonCsvLine(line) {
            const columns = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const ch = line[i];

                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                    continue;
                }

                if (ch === ';' && !inQuotes) {
                    columns.push(current.trim());
                    current = '';
                    continue;
                }

                current += ch;
            }

            columns.push(current.trim());
            return columns;
        }

        function parseQuestionsCsv(csvText) {
            const lines = String(csvText || '').split(/\r?\n/);
            const result = [];
            const seen = new Set();
            let fallbackId = 1;

            for (let i = 0; i < lines.length; i++) {
                const rawLine = lines[i].trim();
                if (!rawLine || rawLine.startsWith('#')) continue;

                const columns = parseSemicolonCsvLine(rawLine);

                const firstColumn = columns[0] || '';
                const secondColumn = columns[1] || '';
                const thirdColumn = columns[2] || '';
                const areaNumColumn = columns[3] || '';
                const areaColumn = columns[4] || '';
                const populationColumn = columns[5] || '';
                const surfaceColumn = columns[6] || '';
                const pilColumn = columns[7] || '';
                const pilProColumn = columns[8] || '';
                const parityColumn = columns[9] || '';
                const democracyColumn = columns[10] || '';
                const womenParliamentColumn = columns[11] || '';
                const pressColumn = columns[12] || '';
                const corruptionColumn = columns[13] || '';
                const businessColumn = columns[14] || '';
                const workersColumn = columns[15] || '';

                const firstNormalized = normalizeCountryName(firstColumn);
                const secondNormalized = normalizeCountryName(secondColumn);

                // Salta eventuale header CSV (id;iso;question oppure varianti)
                if (
                    i === 0 &&
                    ((firstNormalized === 'id' || firstNormalized === 'numero' || firstNormalized === 'num') &&
                        (secondNormalized === 'iso' || secondNormalized === 'country' || secondNormalized === 'countries' || secondNormalized === 'name' || secondNormalized === 'stato' || secondNormalized === 'stati'))
                ) {
                    continue;
                }

                const hasNumericFirst = /^\d+$/.test(firstColumn);
                const countryName = secondColumn || firstColumn;
                const isoCode = thirdColumn || (hasNumericFirst && secondColumn ? secondColumn : firstColumn);
                const id = hasNumericFirst ? firstColumn : String(fallbackId++);
                if (!isoCode) continue;

                const normalized = normalizeCountryName(isoCode);
                if (!normalized) continue;

                if (!seen.has(normalized)) {
                    seen.add(normalized);
                    result.push({
                        id: id,
                        raw: isoCode,
                        key: normalized,
                        countryName: countryName,
                        area: areaColumn,
                        population: populationColumn,
                        surface: surfaceColumn,
                        pil: pilColumn,
                        pilPro: pilProColumn,
                        parity: parityColumn,
                        democracy: democracyColumn,
                        womenInParliament: womenParliamentColumn,
                        press: pressColumn,
                        corruption: corruptionColumn,
                        business: businessColumn,
                        workers: workersColumn
                    });
                }
            }

            return result;
        }

        function mapCsvEntriesToTargetItems(csvEntries, countryIndex) {
            if (!csvEntries.length) {
                throw new Error('Stati_2026.csv e vuoto o non contiene stati validi');
            }

            const items = [];
            const missing = [];
            const seenFeatures = new Set();

            for (const entry of csvEntries) {
                const matched = countryIndex.get(entry.key);
                if (!matched) {
                    missing.push(entry.raw);
                    continue;
                }
                if (!seenFeatures.has(matched)) {
                    seenFeatures.add(matched);
                    items.push({
                        id: entry.id,
                        feature: matched,
                        countryName: entry.countryName,
                        area: entry.area,
                        population: entry.population,
                        surface: entry.surface,
                        pil: entry.pil,
                        pilPro: entry.pilPro,
                        parity: entry.parity,
                        democracy: entry.democracy,
                        womenInParliament: entry.womenInParliament,
                        press: entry.press,
                        corruption: entry.corruption,
                        business: entry.business,
                        workers: entry.workers
                    });
                }
            }

            if (!items.length) {
                throw new Error('Nessuno Stato del CSV coincide con il GeoJSON caricato');
            }

            return {
                items: items,
                missing: missing
            };
        }

        function buildCountryIndex(features) {
            const index = new Map();

            for (const feature of features) {
                const props = feature && feature.properties ? feature.properties : {};
                const aliases = [
                    props.ISO,
                    props.iso,
                    props['ISO3166-1-Alpha-3'],
                    props['ISO3166-1-Alpha-2'],
                    props.ISO_A3,
                    props.ADM0_A3,
                    props.SOV_A3,
                    props.HS_A3,
                    props.TINY,
                    props.ADMIN,
                    props.NAME,
                    props.name,
                    props.BRK_NAME,
                    props.NAME_LONG,
                    props.FORMAL_EN,
                    props.SOVEREIGNT
                ].filter(Boolean);

                for (const alias of aliases) {
                    const key = normalizeCountryName(alias);
                    if (key && !index.has(key)) {
                        index.set(key, feature);
                    }
                }
            }

            return index;
        }

        async function loadCountryPoolFromCsv(countryIndex) {
            const response = await fetch('Stati_2026.csv', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error('File Stati_2026.csv non trovato o non leggibile');
            }

            const csvText = decodeCsvBytes(await response.arrayBuffer());
            const csvEntries = parseQuestionsCsv(csvText);
            return mapCsvEntriesToTargetItems(csvEntries, countryIndex);
        }

        function createModalController() {
            const overlay = document.getElementById('game-modal');
            const titleEl = document.getElementById('modal-title');
            const messageEl = document.getElementById('modal-message');
            const okButton = document.getElementById('modal-ok');

            function closeModal() {
                overlay.classList.remove('is-open');
                overlay.setAttribute('aria-hidden', 'true');
            }

            function showModal(title, message) {
                titleEl.innerText = title;
                messageEl.innerText = message;
                overlay.classList.add('is-open');
                overlay.setAttribute('aria-hidden', 'false');
                okButton.focus();
            }

            okButton.addEventListener('click', closeModal);
            overlay.addEventListener('click', function (event) {
                if (event.target === overlay) closeModal();
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && overlay.classList.contains('is-open')) {
                    closeModal();
                }
            });

            return { showModal: showModal };
        }

        // Funzione di controllo per evitare l'errore "L is not defined"
        async function startApp() {
            if (typeof L === 'undefined') {
                document.getElementById('status').innerHTML = "❌ ERRORE: La libreria Leaflet è stata bloccata dal browser.<br>Prova ad aprire questo file con Firefox o usa un'estensione 'Live Server'.";
                document.getElementById('status').style.color = "red";
                return;
            }

            const statusEl = document.getElementById('status');
            const csvInfoEl = document.getElementById('csv-info');
            const countryNumberInput = document.getElementById('country-number-input');
            const confirmCountryButton = document.getElementById('confirm-country');
            const randomCountryButton = document.getElementById('random-country');
            const loadQuestionsButton = document.getElementById('load-questions-file');
            const questionsFileInput = document.getElementById('questions-file-input');
            const modal = createModalController();
            statusEl.innerText = "⏳ Caricamento confini degli Stati...";
            statusEl.style.color = "blue";

            if (loadQuestionsButton) {
                loadQuestionsButton.style.display = window.location.protocol === 'file:' ? 'inline-block' : 'none';
            }
            
            const map = L.map('map').setView([20, 0], 2);

            let countries = [];
            let targetItems = [];
            let targetFeature = null;
            let targetItem = null;
            let targetCenter = null;
            let targetAttempts = 0;
            const maxTargetAttempts = 5;
            const maxTargetSeconds = 120;
            let targetTimerSecondsLeft = maxTargetSeconds;
            let targetTimerId = null;
            let randomMode = true;
            let countryIndex = new Map();
            const footerEl = document.getElementById('game-footer');
            const attemptsStripEl = document.getElementById('attempts-strip');
            const timerValueEl = document.getElementById('timer-value');
            const brainImageSrc = 'cervello.png';

            function updateFooterAttempts() {
                if (!attemptsStripEl) return;

                const remainingAttempts = Math.max(maxTargetAttempts - targetAttempts, 0);
                attemptsStripEl.innerHTML = Array.from({ length: remainingAttempts }, function () {
                    return '<img class="brain-icon" src="' + brainImageSrc + '" alt="" aria-hidden="true">';
                }).join('');
                attemptsStripEl.setAttribute('aria-label', 'Tentativi residui: ' + remainingAttempts);
            }

            function updateTimerDisplay() {
                if (!timerValueEl) return;

                timerValueEl.innerText = targetTimerSecondsLeft + 's';
            }

            function stopTargetTimer() {
                if (targetTimerId !== null) {
                    window.clearInterval(targetTimerId);
                    targetTimerId = null;
                }
            }

            function handleTimerExpired() {
                if (!targetFeature || targetAttempts >= maxTargetAttempts) return;

                targetAttempts++;
                updateFooterAttempts();
                renderQuestionDisplay();

                if (targetAttempts >= maxTargetAttempts) {
                    modal.showModal(
                        'Tempo scaduto',
                        'Il tempo è scaduto e hai consumato l’ultimo tentativo disponibile.'
                    );
                    stopTargetTimer();
                    return;
                }

                modal.showModal(
                    'Tempo scaduto',
                    'Il tempo è scaduto e hai perso un tentativo.'
                );
               //startTargetTimer();
            }

            function startTargetTimer() {
                stopTargetTimer();
                targetTimerSecondsLeft = maxTargetSeconds;
                updateTimerDisplay();

                if (!targetFeature || targetAttempts >= maxTargetAttempts) return;

                targetTimerId = window.setInterval(function() {
                    targetTimerSecondsLeft -= 1;
                    if (targetTimerSecondsLeft <= 0) {
                        updateTimerDisplay();
                        stopTargetTimer();
                        handleTimerExpired();
                        return;
                    }

                    updateTimerDisplay();
                }, 1000);
            }

            function updateStatusWithTarget(prefix) {
                const targetName = targetFeature ? getCountryName(targetFeature) : '?';
                statusEl.innerText = prefix ;
                /*statusEl.innerText = prefix + " [" + targetName + "]";*/
                statusEl.style.color = "blue";
            }

            function renderQuestionDisplay() {
                const questionDisplayEl = document.getElementById('question-display');
                if (!questionDisplayEl) return;

                if (!targetItem) {
                    questionDisplayEl.classList.remove('active');
                    questionDisplayEl.innerHTML = '';
                    return;
                }

                const hintCards = [
                    { label: 'Area geografica', value: targetItem.area || 'n/d' },
                    { label: 'popolazione (milioni)', value: targetItem.population || 'n/d' },
                    { label: 'superficie (km2)', value: targetItem.surface || 'n/d' },
                    { label: 'PIL', value: targetAttempts >= 1 ? (targetItem.pil || 'n/d') : '---' },
                    { label: 'PIL pro capite', value: targetAttempts >= 1 ? (targetItem.pilPro || 'n/d') : '---' },
                    { label: 'parità di genere', value: targetAttempts >= 2 ? (targetItem.parity || 'n/d') : '---' },
                    { label: 'democrazia', value: targetAttempts >= 2 ? (targetItem.democracy || 'n/d') : '---' },
                    { label: 'donne in parlamento', value: targetAttempts >= 2 ? (targetItem.womenInParliament || 'n/d') : '---' },
                    { label: 'libertà di stampa', value: targetAttempts >= 3 ? (targetItem.press || 'n/d') : '---' },
                    { label: 'lotta alla corruzione', value: targetAttempts >= 3 ? (targetItem.corruption || 'n/d') : '---' },
                    { label: 'facilità di fare affari', value: targetAttempts >= 4 ? (targetItem.business || 'n/d') : '---' },
                    { label: 'diritti dei lavoratori', value: targetAttempts >= 4 ? (targetItem.workers || 'n/d') : '---' }
                ];

                questionDisplayEl.innerHTML =
                    '<div class="hint-grid">' +
                    hintCards.map(function(card) {
                        return '<div class="hint-card"><span class="hint-label">' + card.label + '</span><span class="hint-value">' + card.value + '</span></div>';
                    }).join('') +
                    '</div>';
                questionDisplayEl.classList.add('active');
            }

            function pointToSegmentDistanceMeters(point, segmentStart, segmentEnd) {
                const px = point.x;
                const py = point.y;
                const ax = segmentStart.x;
                const ay = segmentStart.y;
                const bx = segmentEnd.x;
                const by = segmentEnd.y;

                const abx = bx - ax;
                const aby = by - ay;
                const apx = px - ax;
                const apy = py - ay;
                const abLengthSquared = (abx * abx) + (aby * aby);

                if (abLengthSquared === 0) {
                    return Math.sqrt((apx * apx) + (apy * apy));
                }

                const t = Math.max(0, Math.min(1, ((apx * abx) + (apy * aby)) / abLengthSquared));
                const closestX = ax + (t * abx);
                const closestY = ay + (t * aby);
                const dx = px - closestX;
                const dy = py - closestY;

                return Math.sqrt((dx * dx) + (dy * dy));
            }

            function getNearestBoundaryDistanceKm(latlng, geometry) {
                if (!geometry) return null;

                const crs = map.options && map.options.crs ? map.options.crs : L.CRS.EPSG3857;
                const targetPoint = crs.project(L.latLng(latlng.lat, latlng.lng));
                let minDistanceMeters = Infinity;

                function scanRing(ring) {
                    if (!ring || ring.length < 2) return;

                    for (let i = 0; i < ring.length - 1; i++) {
                        const startPoint = crs.project(L.latLng(ring[i][1], ring[i][0]));
                        const endPoint = crs.project(L.latLng(ring[i + 1][1], ring[i + 1][0]));
                        const distanceMeters = pointToSegmentDistanceMeters(targetPoint, startPoint, endPoint);
                        if (distanceMeters < minDistanceMeters) {
                            minDistanceMeters = distanceMeters;
                        }
                    }
                }

                if (geometry.type === 'Polygon') {
                    for (const ring of geometry.coordinates || []) {
                        scanRing(ring);
                    }
                } else if (geometry.type === 'MultiPolygon') {
                    for (const polygon of geometry.coordinates || []) {
                        for (const ring of polygon) {
                            scanRing(ring);
                        }
                    }
                }

                if (!isFinite(minDistanceMeters)) return null;

                return minDistanceMeters / 1000;
            }

            function setTarget(feature, sourceLabel) {
                if (!feature) return;

                targetFeature = feature;
                targetCenter = L.geoJSON(targetFeature).getBounds().getCenter();
                targetAttempts = 0;
                targetItem = targetItems.find(function(item) {
                    return item.feature === feature;
                }) || null;
                updateStatusWithTarget("🎯 " + sourceLabel + ":");
                updateFooterAttempts();
                startTargetTimer();
                renderQuestionDisplay();

                if (countryNumberInput) {
                    countryNumberInput.max = String(targetItems.length || 1);
                }
            }

            function refreshCountryInput() {
                if (countryNumberInput) {
                    countryNumberInput.disabled = targetItems.length === 0;
                    countryNumberInput.min = '1';
                    countryNumberInput.max = String(targetItems.length || 1);
                    countryNumberInput.value = '';
                }

                if (confirmCountryButton) {
                    confirmCountryButton.disabled = targetItems.length === 0;
                }

                randomCountryButton.disabled = targetItems.length === 0;
            }

            function loadQuestionFromInput() {
                stopTargetTimer();
                const questionDisplayEl = document.getElementById('question-display');
                if (!questionDisplayEl || !countryNumberInput) return;

                const selectedNumber = Number(String(countryNumberInput.value || '').trim());
                if (!Number.isInteger(selectedNumber) || selectedNumber < 1 || selectedNumber > targetItems.length) {
                    modal.showModal(
                        'Valore non valido',
                        'Inserisci un numero intero tra 1 e ' + targetItems.length + '.'
                    );
                    return;
                }

                const selectedItem = targetItems[selectedNumber - 1];

                // Auto-set the target when confirmed from the numeric input
                randomMode = false;
                setTarget(selectedItem.feature, "Stato scelto da CSV");
            }

            function setRandomTarget() {
                stopTargetTimer();
                if (!targetItems.length) return;

                let nextItem = targetItems[Math.floor(Math.random() * targetItems.length)];
                if (targetItems.length > 1 && targetFeature) {
                    while (nextItem.feature === targetFeature) {
                        nextItem = targetItems[Math.floor(Math.random() * targetItems.length)];
                    }
                }
                //document.getElementById('question-display').textContent = nextItem.feature;

                //setTarget(nextItem.feature, "Indovina lo Stato");

                if (countryNumberInput) {
                    const randomIndex = targetItems.findIndex(function(item) {
                        return item.feature === nextItem.feature;
                    });
                    if (randomIndex >= 0) {
                        countryNumberInput.value = String(randomIndex + 1);
                    }
                }
            }

            try {
                const response = await fetch('countries.geojson', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Impossibile leggere countries.geojson');
                }

                const geojson = await response.json();
                countries = (geojson.features || []).filter(function(feature) {
                    const type = feature && feature.geometry ? feature.geometry.type : '';
                    return type === 'Polygon' || type === 'MultiPolygon';
                });

                const countryBorders = L.geoJSON(geojson, {
                    style: {
                        color: '#2f6f2f',
                        weight: 1,
                        fillColor: '#7bc67b',
                        fillOpacity: 0.7
                    },
                    onEachFeature: function(feature, layer) {
                        layer.bindTooltip(getCountryName(feature), {
                            sticky: true,
                            direction: 'auto',
                            opacity: 0.95
                        });

                        layer.on('mouseover', function() {
                            layer.setStyle({
                                weight: 2,
                                fillOpacity: 0.85
                            });
                        });

                        layer.on('mouseout', function() {
                            countryBorders.resetStyle(layer);
                        });
                    }
                }).addTo(map);
                map.fitBounds(countryBorders.getBounds(), { padding: [8, 8] });

                if (!countries.length) {
                    throw new Error('Nessun confine valido disponibile');
                }

                countryIndex = buildCountryIndex(countries);
                try {
                    if (window.location.protocol === 'file:') {
                        throw new Error('Esecuzione da file locale (file://): fetch del CSV bloccato dal browser');
                    }

                    const csvResult = await loadCountryPoolFromCsv(countryIndex);
                    targetItems = csvResult.items;
                    if (csvInfoEl) {
                        csvInfoEl.innerText = "Lista attiva: Stati_2026.csv (" + targetItems.length + " stati caricati)";
                    }

                    if (csvResult.missing.length) {
                        const preview = csvResult.missing.slice(0, 8).join(', ');
                        const suffix = csvResult.missing.length > 8 ? "..." : "";
                        modal.showModal(
                            "CSV parziale",
                            "Alcuni nomi nel CSV non corrispondono al dataset:\n" + preview + suffix
                        );
                    }
                } catch (csvError) {
                    if (window.location.protocol === 'file:') {
                        if (csvInfoEl) {
                            csvInfoEl.innerText = "file:// rilevato: usa il pulsante Carica Stati_2026.csv oppure avvia un server locale.";
                        }
                        modal.showModal(
                            "Caricamento CSV bloccato",
                            "Il browser blocca fetch di Stati_2026.csv quando apri la pagina con file://.\n" +
                            "Soluzioni:\n" +
                            "1) Avvia un server locale (es. Live Server)\n" +
                            "2) Oppure usa il pulsante Carica Stati_2026.csv"
                        );
                        refreshCountryInput();
                        return;
                    }

                    targetItems = countries.map(function(feature, index) {
                        return {
                            id: String(index + 1),
                            question: 'Trova lo Stato: ' + getCountryName(feature),
                            feature: feature
                        };
                    });
                    if (csvInfoEl) {
                        csvInfoEl.innerText = "CSV non disponibile: uso tutti gli Stati del dataset.";
                    }
                    modal.showModal(
                        "Avviso CSV",
                        "Non sono riuscito a usare Stati_2026.csv.\nDettaglio: " + csvError.message +
                        "\nUso automaticamente tutti gli Stati disponibili."
                    );
                }

                refreshCountryInput();
                setRandomTarget();
            } catch (error) {
                statusEl.innerHTML = "❌ Errore nel caricamento dei confini locali.<br>Verifica che countries.geojson sia nella stessa cartella e apri la pagina via server locale (http://localhost:PORT).";
                statusEl.style.color = "red";
                modal.showModal(
                    "Errore confini locali",
                    "Non riesco a caricare countries.geojson.\n" +
                    "Dettaglio: " + error.message + "\n" +
                    "Controlla che il file esista nella cartella del progetto e avvia la pagina con un server locale."
                );
                return;
            }

            if (loadQuestionsButton && questionsFileInput) {
                loadQuestionsButton.addEventListener('click', function() {
                    questionsFileInput.click();
                });

                questionsFileInput.addEventListener('change', async function() {
                    const selectedFile = questionsFileInput.files && questionsFileInput.files[0];
                    if (!selectedFile) return;

                    try {
                        const csvText = decodeCsvBytes(await selectedFile.arrayBuffer());
                        const csvEntries = parseQuestionsCsv(csvText);
                        const csvResult = mapCsvEntriesToTargetItems(csvEntries, countryIndex);

                        targetItems = csvResult.items;
                        refreshCountryInput();
                        setRandomTarget();

                        if (csvResult.missing.length) {
                            const preview = csvResult.missing.slice(0, 8).join(', ');
                            const suffix = csvResult.missing.length > 8 ? '...' : '';
                            modal.showModal(
                                'CSV parziale',
                                'Alcuni nomi nel CSV non corrispondono al dataset:\n' + preview + suffix
                            );
                        }
                    } catch (error) {
                        modal.showModal(
                            'Errore CSV',
                            'Non riesco a leggere questions.csv selezionato.\nDettaglio: ' + error.message
                        );
                    } finally {
                        questionsFileInput.value = '';
                    }
                });
            }

            if (confirmCountryButton) {
                confirmCountryButton.addEventListener('click', loadQuestionFromInput);
            }

            if (countryNumberInput) {
                countryNumberInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        loadQuestionFromInput();
                    }
                });
            }

            randomCountryButton.addEventListener('click', function() {
                randomMode = true;
                setRandomTarget();
            });

            map.on('click', function(e) {
                if (!targetFeature) return;

                if (targetAttempts >= maxTargetAttempts) {
                    stopTargetTimer();
                    modal.showModal(
                        "Risultato",
                        "⚠️ Tentativi esauriti per questo Stato." +
                        "\nI tentativi disponibili erano " + maxTargetAttempts + "."
                    );
                    return;
                }

                targetAttempts++;
                updateFooterAttempts();
                startTargetTimer();
                renderQuestionDisplay();
                const point = [e.latlng.lng, e.latlng.lat];
                const correct = isPointInGeometry(point, targetFeature.geometry);

                if (correct) {
                    const wrongAttempts = Math.max(targetAttempts - 1, 0);
                    modal.showModal(
                        "Risultato",
                        "✅ Corretto! Hai cliccato dentro i confini di " + getCountryName(targetFeature) + "." +
                        "\nTentativi utilizzati: " + targetAttempts + "." +
                        (wrongAttempts > 0 ? "\nTentativi sbagliati prima della risposta esatta: " + wrongAttempts + "." : "")
                    );
                    /*
                    if (randomMode) {
                        setRandomTarget();
                    } else {
                        updateStatusWithTarget("✅ Centrato. Puoi cambiare Stato da CSV oppure cliccare Random:");
                    }
                    */
                    updateStatusWithTarget("✅ Centrato. Puoi cambiare Stato da CSV oppure cliccare Random:");
                    //startTargetTimer();
                    updateFooterAttempts();
                    return;
                }

                let clickedCountry = null;
                for (const feature of countries) {
                    if (isPointInGeometry(point, feature.geometry)) {
                        clickedCountry = feature;
                        break;
                    }
                }

                const where = clickedCountry ? getCountryName(clickedCountry) : 'mare aperto';
                const distanceHintKm = getNearestBoundaryDistanceKm(e.latlng, targetFeature.geometry);
                const distanceHintText = distanceHintKm !== null ? distanceHintKm.toFixed(0) : '?';

                modal.showModal(
                    "Risultato",
                    "❌ Sbagliato. Hai cliccato in: " + where + "." +
                    "\nIndizio distanza dal confine più vicino: circa " + distanceHintText + " km." +
                    "\nTentativi residui: " + Math.max(maxTargetAttempts - targetAttempts, 0) + "." +
                    (targetAttempts >= maxTargetAttempts ? "\nTentativi esauriti." : "\nRiprova!")
                );
            });
        }

        // Aspetta che tutto sia pronto
        window.onload = startApp;
    </script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { 
            (window.vaq = window.vaq || []).push(arguments); 
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
