<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Geo-Guessr NEXT</title>
    <!-- Riferimento al file locale scaricato -->
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; }
        #map { height: 700px; width: 80%; margin: 20px auto; border: 2px solid #333; background: #ddd; }
        #status { font-weight: bold; color: blue; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.is-open {
            display: flex;
        }
        .modal-card {
            width: min(460px, 100%);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.25);
            padding: 20px;
            text-align: left;
        }
        #modal-title {
            margin: 0 0 10px;
            font-size: 1.25rem;
            color: #1a1a1a;
        }
        #modal-message {
            margin: 0;
            color: #333;
            line-height: 1.5;
            white-space: pre-line;
        }
        #modal-ok {
            margin-top: 16px;
            border: none;
            border-radius: 10px;
            background: #2a7bd6;
            color: #fff;
            font-weight: 600;
            padding: 10px 18px;
            cursor: pointer;
        }
        #modal-ok:hover {
            background: #2168b5;
        }
    </style>
</head>
<body>

    <h1>📍 Quiz Geografico</h1>
    <div id="status">Inizializzazione in corso...</div>
    <div id="map"></div>
    <div id="game-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title">Geo-Guessr NEXT</h2>
            <p id="modal-message"></p>
            <button id="modal-ok" type="button">OK</button>
        </div>
    </div>

  <!-- Riferimento al file locale scaricato -->
    <script src="leaflet.js"></script>

    <script>
        // Algoritmo ray-casting per verificare se un punto e dentro un anello [lng, lat]
        function isPointInRing(point, ring) {
            const x = point[0];
            const y = point[1];
            let inside = false;

            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i][0];
                const yi = ring[i][1];
                const xj = ring[j][0];
                const yj = ring[j][1];

                const intersect = ((yi > y) !== (yj > y)) &&
                    (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi);

                if (intersect) inside = !inside;
            }

            return inside;
        }

        // Supporto GeoJSON Polygon e MultiPolygon
        function isPointInGeometry(point, geometry) {
            if (!geometry) return false;

            if (geometry.type === 'Polygon') {
                const rings = geometry.coordinates;
                if (!rings.length) return false;

                if (!isPointInRing(point, rings[0])) return false;
                for (let i = 1; i < rings.length; i++) {
                    if (isPointInRing(point, rings[i])) return false;
                }
                return true;
            }

            if (geometry.type === 'MultiPolygon') {
                for (const polygon of geometry.coordinates) {
                    if (!polygon.length) continue;

                    if (!isPointInRing(point, polygon[0])) continue;

                    let inHole = false;
                    for (let i = 1; i < polygon.length; i++) {
                        if (isPointInRing(point, polygon[i])) {
                            inHole = true;
                            break;
                        }
                    }

                    if (!inHole) return true;
                }
            }

            return false;
        }

        function getCountryName(feature) {
            const props = feature && feature.properties ? feature.properties : {};
            return props.ADMIN || props.NAME || props.name || 'Stato sconosciuto';
        }

        function createModalController() {
            const overlay = document.getElementById('game-modal');
            const titleEl = document.getElementById('modal-title');
            const messageEl = document.getElementById('modal-message');
            const okButton = document.getElementById('modal-ok');

            function closeModal() {
                overlay.classList.remove('is-open');
                overlay.setAttribute('aria-hidden', 'true');
            }

            function showModal(title, message) {
                titleEl.innerText = title;
                messageEl.innerText = message;
                overlay.classList.add('is-open');
                overlay.setAttribute('aria-hidden', 'false');
                okButton.focus();
            }

            okButton.addEventListener('click', closeModal);
            overlay.addEventListener('click', function (event) {
                if (event.target === overlay) closeModal();
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && overlay.classList.contains('is-open')) {
                    closeModal();
                }
            });

            return { showModal: showModal };
        }

        // Funzione di controllo per evitare l'errore "L is not defined"
        async function startApp() {
            if (typeof L === 'undefined') {
                document.getElementById('status').innerHTML = "❌ ERRORE: La libreria Leaflet è stata bloccata dal browser.<br>Prova ad aprire questo file con Firefox o usa un'estensione 'Live Server'.";
                document.getElementById('status').style.color = "red";
                return;
            }

            const statusEl = document.getElementById('status');
            const modal = createModalController();
            statusEl.innerText = "⏳ Caricamento confini degli Stati...";
            statusEl.style.color = "blue";
            
            const map = L.map('map').setView([20, 0], 2);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            let countries = [];
            let targetFeature = null;
            let targetCenter = null;

            function setRandomTarget() {
                if (!countries.length) return;

                let next = countries[Math.floor(Math.random() * countries.length)];
                if (countries.length > 1 && targetFeature) {
                    while (next === targetFeature) {
                        next = countries[Math.floor(Math.random() * countries.length)];
                    }
                }

                targetFeature = next;
                targetCenter = L.geoJSON(targetFeature).getBounds().getCenter();
                statusEl.innerText = "🎯 Indovina lo Stato: [" + getCountryName(targetFeature) + "]";
                statusEl.style.color = "blue";
            }

            try {
                const response = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
                if (!response.ok) {
                    throw new Error('Impossibile scaricare i confini degli Stati');
                }

                const geojson = await response.json();
                countries = (geojson.features || []).filter(function(feature) {
                    const type = feature && feature.geometry ? feature.geometry.type : '';
                    return type === 'Polygon' || type === 'MultiPolygon';
                });

                if (!countries.length) {
                    throw new Error('Nessun confine valido disponibile');
                }

                setRandomTarget();
            } catch (error) {
                statusEl.innerHTML = "❌ Errore nel caricamento dei confini.<br>Apri la pagina con Live Server e verifica la connessione Internet.";
                statusEl.style.color = "red";
                return;
            }

            map.on('click', function(e) {
                if (!targetFeature) return;

                const point = [e.latlng.lng, e.latlng.lat];
                const correct = isPointInGeometry(point, targetFeature.geometry);

                if (correct) {
                    modal.showModal(
                        "Risultato",
                        "✅ Corretto! Hai cliccato dentro i confini di " + getCountryName(targetFeature) + "."
                    );
                    setRandomTarget();
                    return;
                }

                let clickedCountry = null;
                for (const feature of countries) {
                    if (isPointInGeometry(point, feature.geometry)) {
                        clickedCountry = feature;
                        break;
                    }
                }

                const where = clickedCountry ? getCountryName(clickedCountry) : 'mare aperto';
                const distanceHintKm = targetCenter
                    ? (map.distance(e.latlng, targetCenter) / 1000).toFixed(0)
                    : '?';

                modal.showModal(
                    "Risultato",
                    "❌ Sbagliato. Hai cliccato in: " + where + "." +
                    "\nIndizio distanza dallo Stato corretto: circa " + distanceHintKm + " km." +
                    "\nRiprova!"
                );
            });
        }

        // Aspetta che tutto sia pronto
        window.onload = startApp;
    </script>
</body>
</html>
